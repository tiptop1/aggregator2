[package]
name = "aggregator2"
version = "1.0.0"
edition = "2024"

[dependencies]
rust_decimal = "1.42.1"
chrono = "0.4"
anyhow = { version="1.0.103", features=["std", "backtrace"] }
async-trait = "0.1.89"
tokio = { version="1.52.3", features = ["full"] }
toml = "1.1.2"
serde = { version = "1.0", features = ["derive"] }
reqwest = "0.13.4"
serde_json = "1.0.150"
serde_json_path = "0.7.2"
redb = "4.2.0"
plotters = "0.3.7"
clap = { version = "4.6.7", features = ["derive"] }
image = "0.25.10"
rust_decimal_macros = "1.40.0"
uuid = { version = "1.27.0", features = ["v4"] }
lettre = { version = "0.11.23", features = ["tokio1-native-tls", "builder"] }

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "1.1.2"

[dev-dependencies]
rust_decimal_macros = "1.40.0"
tempfile = "3.27.0"
wiremock = "0.6.5"
