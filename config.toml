# Test comment
database_path = "db.txt"

[[symbols]]
name = "BTC"
url = "https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1d&limit=365"

# [symbols.http_headers]
# x-cg-demo-api-key = "${coingecko_api_key}"

[symbols.candle_fields]
timestamp = "$[*][0]"
open = "$[*][1]"
high = "$[*][2]"
low = "$[*][3]"
close = "$[*][4]"
volume = "$[*][5]"

[[symbols.report_elements]]
type = "last_candle"
caption = "Last price"
[[symbols.report_elements]]
type = "candle_chart"
period = "daily"
limit = 90
caption = "Last 90 days"
[[symbols.report_elements]]
type = "candle_chart"
period = "monthly"
limit = 12
caption = "Last 12 months"

